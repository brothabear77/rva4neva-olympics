# Generate the Xcode project with `xcodegen` (run in ios/). The .xcodeproj is not committed.
name: RVA4NEVA
options:
  bundleIdPrefix: com.rva4neva
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  RVA4NEVA:
    type: application
    platform: iOS
    sources:
      - RVA4NEVA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rva4neva.olympics
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: RVA4NEVA/Info.plist
      properties:
        CFBundleDisplayName: "#rva4neva"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        API_BASE_URL: $(API_BASE_URL)
        UILaunchScreen:
          UIColorName: Ink
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  RVA4NEVATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RVA4NEVATests
    dependencies:
      - target: RVA4NEVA
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RVA4NEVA:
    build:
      targets:
        RVA4NEVA: all
    test:
      targets:
        - RVA4NEVATests
