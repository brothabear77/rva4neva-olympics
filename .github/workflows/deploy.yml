name: Deploy

# Every push to main ships to production, docs-only commits included: "main is what is
# running" stays literally true, rather than true only for commits someone remembered to
# tag. workflow_dispatch is there so a deploy can be re-run by hand without an empty commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required to mint the OIDC token AWS trusts
  contents: read

concurrency:
  # App Runner refuses a second operation on a service while one is in flight. Two merges
  # in quick succession queue instead of colliding, and cancel-in-progress stays false so a
  # deploy already underway is never abandoned mid-way.
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # matches node:22-alpine in the Dockerfile
      - run: npm ci
      # tsconfig.json's include has .next/types/**/*.ts: Next generates a PageProps type per
      # route (used in src/app/**/page.tsx) into that directory, and only ever writes it as
      # part of `next build` or `next dev`. A fresh checkout has no .next, so a bare
      # `tsc --noEmit` fails on every page with "Cannot find name 'PageProps'" — not a real
      # type error, just missing generated types. `next typegen` writes only that directory,
      # without a full build or a database connection.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm ci
        working-directory: infra/cdk
      - run: npx tsc --noEmit
        working-directory: infra/cdk
      - run: npx cdk synth
        working-directory: infra/cdk
        env:
          JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: "1"
          CDK_DISABLE_VERSION_CHECK: "1"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      migration: ${{ steps.diff.outputs.migration }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Enough history to diff this push against what was running before it, to decide
          # whether `migrate` (below) needs to run. github.event.before is the tip before
          # this push; fetch-depth 0 guarantees it's actually present to diff against.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No access key: this assumes rva4neva-olympics-github-deploy (infra/cdk/lib/ci-stack.ts),
      # which trusts only a GitHub-issued token that says "push to main, this repository".
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::737695750939:role/rva4neva-olympics-github-deploy
          aws-region: us-east-1
          role-session-name: github-actions-deploy
      - run: npm ci
      - run: npm run deploy -- --ci
      # Decides whether the `migrate` job below runs. before is empty on the very first
      # push a workflow ever sees for this repo (and, defensively, on anything that isn't a
      # plain fast-forward, like a force-push) — treated as "yes" rather than risk silently
      # skipping a schema change migrate.ts itself would still apply safely either way.
      - id: diff
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "migration=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$before" "${{ github.sha }}" -- drizzle/; then
            echo "migration=false" >> "$GITHUB_OUTPUT"
          else
            echo "migration=true" >> "$GITHUB_OUTPUT"
          fi

  # Only when this push touched drizzle/ (or, in a workflow_dispatch re-run, always — see
  # the diff step above). Runs as a separate role from `deploy`, on purpose: an ordinary
  # code-only deploy never even has the option of reading the database's credentials,
  # whatever runs during it. See infra/aws.md and MigrateRole's comment in ci-stack.ts.
  migrate:
    needs: deploy
    if: needs.deploy.outputs.migration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::737695750939:role/rva4neva-olympics-github-migrate
          aws-region: us-east-1
          role-session-name: github-actions-migrate
      - run: npm ci
      - run: npm run aws:db -- --ci
