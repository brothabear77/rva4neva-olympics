# Local Postgres for development. Matches the Aurora Serverless v2 engine
# version used in production so migrations behave identically.
services:
  db:
    image: postgres:17
    container_name: rva4neva-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: olympics
      POSTGRES_PASSWORD: olympics
      POSTGRES_DB: olympics
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olympics -d olympics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
